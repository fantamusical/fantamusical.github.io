<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ed">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Fantamusical | Il fantagioco dei musical</title>
  <style>

    :root {
      color-scheme: light;
      --paper: #f4f3ed;
      --surface: #fffefa;
      --ink: #20342e;
      --muted: #6d7871;
      --line: #dfe3d9;
      --green: #245c48;
      --green-dark: #183e32;
      --lime: #d9ef84;
      --coral: #e87860;
      --gold: #d8a947;
      --shadow: 0 12px 34px rgba(32, 52, 46, .07);
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --sans: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); font: 14px/1.5 var(--sans); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .shell { display: grid; grid-template-columns: 238px minmax(0, 1fr); min-height: 100vh; }
    aside { position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh; padding: 27px 18px 20px; color: #f5f4ed; background: var(--green-dark); }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 9px 36px; }
    .brand-mark { display: grid; width: 39px; height: 39px; place-items: center; color: var(--green-dark); background: var(--lime); border-radius: 12px 12px 12px 3px; font: bold 22px var(--serif); }
    .brand-name { font: 21px/1 var(--serif); letter-spacing: 0; }
    .brand-caption { margin-top: 5px; color: #a9bbb0; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .nav-label { padding: 0 10px 10px; color: #91a79a; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .nav { display: grid; gap: 5px; }
    .nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; color: #c8d3cc; background: transparent; border: 0; border-radius: 8px; text-align: left; transition: background .16s, color .16s; }
    .nav button:hover, .nav button.active { color: white; background: rgba(255,255,255,.1); }
    .nav button.active { box-shadow: inset 3px 0 var(--lime); }
    .nav-icon { display: grid; width: 19px; place-items: center; font-size: 17px; }
    .side-note { margin-top: auto; padding: 14px 13px; color: #b6c4bb; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; font-size: 11px; }
    .side-note strong { display: block; margin-bottom: 4px; color: var(--lime); font-size: 12px; }
    main { min-width: 0; padding: 36px clamp(20px, 5vw, 68px) 60px; background-image: radial-gradient(rgba(36,92,72,.055) .7px, transparent .7px); background-size: 18px 18px; }
    .topline { display: flex; justify-content: space-between; align-items: center; gap: 16px; max-width: 1120px; margin: 0 auto 34px; }
    .crumb { color: var(--muted); font-size: 12px; }
    .round-label { display: flex; align-items: center; gap: 8px; padding: 7px 11px; color: var(--green); background: #e9efe1; border-radius: 99px; font-size: 11px; font-weight: 650; }
    .round-dot { width: 7px; height: 7px; background: #7eaa50; border-radius: 50%; }
    #view { max-width: 1120px; margin: 0 auto; }
    .page-heading { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 27px; }
    .eyebrow { margin-bottom: 7px; color: var(--green); font-size: 10px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font: 42px/1.05 var(--serif); letter-spacing: 0; }
    .intro { max-width: 550px; margin: 9px 0 0; color: var(--muted); }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 39px; padding: 0 15px; color: white; background: var(--green); border: 1px solid var(--green); border-radius: 6px; font-weight: 650; transition: background .15s, transform .15s; }
    .button:hover { background: var(--green-dark); transform: translateY(-1px); }
    .button.secondary { color: var(--ink); background: var(--surface); border-color: var(--line); }
    .button.secondary:hover { background: #f0f3eb; }
    .button.small { min-height: 32px; padding: 0 11px; font-size: 12px; }
    .button .plus { font-size: 18px; line-height: 0; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; margin-bottom: 25px; }
    .stat { display: flex; align-items: center; justify-content: space-between; min-height: 104px; padding: 19px 21px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { margin-top: 3px; font: 32px/1 var(--serif); }
    .stat-mark { display: grid; width: 38px; height: 38px; place-items: center; color: var(--green); background: #edf2e8; border-radius: 50%; font-size: 18px; }
    .columns { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(270px, .8fr); gap: 16px; }
    .panel { min-width: 0; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    h2 { margin: 0; font: 22px/1.15 var(--serif); }
    h3 { margin: 0; font-size: 13px; }
    .subtle { color: var(--muted); font-size: 12px; }
    .leader-row { display: grid; grid-template-columns: 29px minmax(0, 1fr) auto; align-items: center; gap: 11px; padding: 12px 0; border-top: 1px solid #edf0e9; }
    .leader-row:first-child { border-top: 0; }
    .rank-number { color: #86928b; font: 17px var(--serif); }
    .person-name { font-weight: 680; }
    .score { color: var(--green); font-weight: 750; }
    .empty { padding: 27px 12px; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 5px; color: var(--ink); font: 19px var(--serif); }
    .steps { display: grid; gap: 0; }
    .step { display: grid; grid-template-columns: 27px 1fr; gap: 11px; padding: 13px 0; border-top: 1px solid #edf0e9; }
    .step:first-child { border-top: 0; }
    .step-num { display: grid; width: 25px; height: 25px; place-items: center; color: var(--green); background: #eaf0e4; border-radius: 50%; font-size: 11px; font-weight: 700; }
    .step p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .field { display: grid; gap: 6px; min-width: 0; }
    .field label, .field-label { color: #536159; font-size: 11px; font-weight: 700; }
    input, select { width: 100%; min-width: 0; height: 39px; padding: 0 11px; color: var(--ink); background: #fff; border: 1px solid #d8dfd5; border-radius: 5px; outline: none; }
    input:focus, select:focus { border-color: #6b977c; box-shadow: 0 0 0 3px rgba(36,92,72,.1); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; padding: 15px; margin-bottom: 17px; background: #f0f2eb; border-radius: 7px; }
    .toolbar .field { flex: 1 1 190px; }
    .choice-list { display: grid; gap: 13px; }
    .choice-card { overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .choice-top { display: grid; grid-template-columns: 35px minmax(0,1fr); align-items: center; gap: 12px; padding: 15px 17px; background: #fbfbf7; border-bottom: 1px solid #edf0e9; }
    .choice-rank { display: grid; width: 33px; height: 33px; place-items: center; color: #293d33; background: var(--lime); border-radius: 50%; font: 18px var(--serif); }
    .choice-top .field { grid-template-columns: auto minmax(0,1fr); align-items: center; gap: 13px; }
    .cast-wrap { padding: 15px 17px 17px; }
    .cast-heading { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .cast-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px 13px; }
    .cast-grid .field { gap: 4px; }
    .cast-grid label { font-size: 10px; }
    .form-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 16px; }
    .form-message { color: var(--muted); font-size: 12px; }
    .class-list { display: grid; gap: 13px; }
    .class-card, .catalog-card { padding: 17px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .student-list { display: flex; flex-wrap: wrap; gap: 7px; margin: 13px 0; }
    .student-chip { padding: 5px 9px; color: #3e5548; background: #edf2e9; border-radius: 4px; font-size: 11px; }
    .inline-form { display: flex; gap: 8px; margin-top: 12px; }
    .inline-form input { flex: 1; }
    .catalog-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .role-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 11px 0 14px; }
    .role-chip { padding: 4px 8px; color: #61513a; background: #f5efdf; border: 1px solid #ede5d0; border-radius: 4px; font-size: 10px; }
    .catalog-card .inline-form { align-items: center; }
    .catalog-card .inline-form input { height: 34px; }
    .result-selectors { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; padding: 15px; margin-bottom: 14px; background: #f0f2eb; border-radius: 7px; }
    .result-cast { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 11px 14px; margin-top: 16px; }
    .score-legend { padding: 14px 15px; color: #59665d; background: #eff3e8; border-left: 3px solid var(--lime); border-radius: 3px; font-size: 12px; }
    .score-legend strong { color: var(--ink); }
    .board-row { display: grid; grid-template-columns: 34px minmax(0,1fr) 75px 85px; align-items: center; gap: 10px; padding: 13px 5px; border-top: 1px solid #edf0e9; }
    .board-row.board-head { color: var(--muted); border-top: 0; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .board-score { text-align: right; font-weight: 750; }
    .board-classes { color: var(--muted); text-align: right; font-size: 11px; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 5; padding: 11px 16px; color: white; background: var(--green-dark); border-radius: 5px; box-shadow: var(--shadow); animation: rise .2s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .mobile-brand { display: none; }
    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; }
      aside { position: sticky; z-index: 3; top: 0; display: block; width: 100%; height: auto; padding: 10px 14px 0; }
      .brand { display: none; }
      .mobile-brand { display: flex; align-items: center; gap: 9px; padding: 3px 5px 10px; font: 18px var(--serif); }
      .mobile-brand .brand-mark { width: 29px; height: 29px; font-size: 17px; }
      .nav-label, .side-note { display: none; }
      .nav { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 9px; }
      .nav button { flex: 0 0 auto; justify-content: center; width: auto; padding: 8px 10px; font-size: 11px; }
      .nav button.active { box-shadow: inset 0 -2px var(--lime); }
      .nav-icon { display: none; }
      main { padding: 22px 18px 42px; }
      .topline { margin-bottom: 24px; }
      h1 { font-size: 36px; }
      .columns { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .page-heading { align-items: start; flex-direction: column; gap: 15px; }
      .stats { gap: 8px; }
      .stat { min-height: 87px; padding: 13px 11px; }
      .stat-label { font-size: 10px; }
      .stat-value { font-size: 27px; }
      .stat-mark { width: 30px; height: 30px; font-size: 14px; }
      .panel { padding: 16px; }
      .form-grid, .cast-grid, .catalog-grid, .result-selectors, .result-cast { grid-template-columns: 1fr; }
      .choice-top { padding: 12px; }
      .choice-top .field { grid-template-columns: 1fr; gap: 5px; }
      .cast-wrap { padding: 13px 12px; }
      .board-row { grid-template-columns: 26px minmax(0,1fr) 57px; gap: 7px; }
      .board-row > :last-child { display: none; }
      .board-row.board-head > :last-child { display: none; }
    }
    /* ---- Fantamusical online additions ---- */
    body:not(.signed-in) .nav, body:not(.signed-in) .nav-label, body:not(.signed-in) .user-chip { display: none; }
    .user-chip { display: flex; align-items: center; gap: 9px; padding: 4px 4px 4px 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; font-size: 12px; }
    .user-chip span { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .avatar { width: 26px; height: 26px; flex: 0 0 auto; border-radius: 50%; object-fit: cover; background: #e6ece1; }
    .avatar.fallback { display: grid; place-items: center; color: var(--green); font-size: 11px; font-weight: 700; }
    .tabs { display: flex; gap: 4px; margin-bottom: 18px; padding: 4px; overflow-x: auto; background: #e9eee3; border-radius: 8px; }
    .tabs button { flex: 0 0 auto; padding: 8px 14px; color: #4d5c53; background: transparent; border: 0; border-radius: 6px; font-weight: 650; }
    .tabs button.active { color: var(--ink); background: var(--surface); box-shadow: 0 1px 3px rgba(32,52,46,.12); }
    .badge { display: inline-grid; min-width: 19px; height: 19px; place-items: center; margin-left: 6px; padding: 0 5px; color: white; background: var(--coral); border-radius: 99px; font-size: 10px; font-weight: 750; }
    .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .class-link { display: block; padding: 17px; color: inherit; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); transition: transform .15s, border-color .15s; }
    .class-link:hover { border-color: #b8cbb9; transform: translateY(-2px); }
    .class-link h3 { font: 20px/1.2 var(--serif); }
    .class-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; color: var(--muted); font-size: 12px; }
    .code { padding: 2px 6px; color: var(--green-dark); background: #edf2e8; border-radius: 4px; font: 600 12px ui-monospace, Consolas, monospace; letter-spacing: .06em; }
    .person-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid #edf0e9; }
    .person-row:first-child { border-top: 0; }
    .person-row .grow { flex: 1; min-width: 0; }
    .person-row .actions { display: flex; gap: 6px; }
    .status-ok { color: var(--green); font-size: 12px; font-weight: 650; }
    .status-wait { color: var(--muted); font-size: 12px; }
    .link-box { display: flex; gap: 8px; }
    .link-box input { flex: 1; font: 12px ui-monospace, Consolas, monospace; }
    .student-chip { display: inline-flex; align-items: center; gap: 6px; }
    .chip-x { padding: 0 2px; color: #7a8a80; background: none; border: 0; font-size: 14px; line-height: 1; }
    .chip-x:hover { color: var(--coral); }
    .notice { padding: 13px 15px; margin-bottom: 15px; color: #5b4a22; background: #fbf3dc; border: 1px solid #f0e2b6; border-radius: 6px; font-size: 13px; }
    .login-card { max-width: 520px; margin: 6vh auto 0; padding: 34px 30px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
    .login-card h1 { margin-bottom: 10px; }
    .login-card .intro { margin: 0 auto 24px; }
    #google-button { display: flex; justify-content: center; min-height: 44px; }
    .picks { margin: 6px 0 0 39px; color: var(--muted); font-size: 12px; }
    .picks b { color: var(--ink); font-weight: 650; }
    .board-row.compact { grid-template-columns: 34px minmax(0,1fr) 75px; }
    .button:disabled { opacity: .55; cursor: wait; transform: none; }
    .button.danger { color: #9b3a26; background: var(--surface); border-color: #efc9bf; }
    .two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    a.inline { color: var(--green); }
    .actor-picks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .actor-picks select { flex: 1 1 140px; height: 34px; }
    .student-chip.hit, .role-chip.hit { color: #1f5a3f; background: #dff0c8; }
    .choice-card.hit { border-color: #b7d98f; }
    .board-row.compact > :last-child { display: block; }
    .result-strip { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 17px; margin-bottom: 15px; background: #eef5df; border: 1px solid #d6e8b6; border-radius: 8px; }
    .result-strip .eyebrow { margin-bottom: 2px; }
    .result-title { font: 22px/1.2 var(--serif); }
    .result-points { color: var(--green); font: 34px/1 var(--serif); white-space: nowrap; }
    .result-points span { font: 600 13px var(--sans); }
    .team-list { display: grid; gap: 12px; }
    .team-card { padding: 15px 17px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .team-card.muted { opacity: .7; box-shadow: none; }
    .team-head { display: flex; align-items: center; gap: 10px; }
    .team-head .grow { flex: 1; min-width: 0; }
    .team-choices { display: grid; gap: 8px; margin-top: 12px; }
    .team-choice { display: flex; gap: 10px; padding: 9px 11px; background: #fafaf5; border: 1px solid #edf0e9; border-radius: 6px; }
    .team-choice.hit { background: #f3f9e8; border-color: #d6e8b6; }
    .team-choice .grow { flex: 1; min-width: 0; }
    .choice-num { display: grid; width: 22px; height: 22px; flex: 0 0 auto; place-items: center; color: #293d33; background: var(--lime); border-radius: 50%; font: 12px var(--serif); }
    .user-link { color: inherit; text-decoration: none; }
    .user-link:hover span { text-decoration: underline; }
    .consent { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; color: #45544b; background: #f3f6ee; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
    .consent input { width: 18px; height: 18px; margin-top: 2px; flex: 0 0 auto; }
    .pick-row { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(0, 2fr); gap: 8px; }
    .mini-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .mini-result { display: grid; gap: 2px; padding: 10px 12px; background: #fafaf5; border: 1px solid #edf0e9; border-radius: 6px; font-size: 12px; }
    .mini-result span { color: var(--muted); }
    .mini-result.done { background: #f3f9e8; border-color: #d6e8b6; }
    .mini-result.done span { color: var(--ink); font-weight: 650; }
    .team-card.mine { border-color: #b8cbb9; }
    a.code { text-decoration: none; }
    @media (max-width: 560px) { .pick-row { grid-template-columns: 1fr; } }
    .rules .step { padding: 18px 0; }
    .rules p { margin: 6px 0 0; color: #45544b; }
    .rules ul { margin: 8px 0 0; padding-left: 18px; color: #45544b; }
    .rules li { margin: 4px 0; }
    @media (max-width: 820px) { .two-col { grid-template-columns: 1fr; } .user-chip span { display: none; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><div class="brand-mark">F</div><div><div class="brand-name">Fantamusical</div><div class="brand-caption">Il fantagioco dei musical</div></div></div>
      <div class="mobile-brand"><div class="brand-mark">F</div><span>Fantamusical</span></div>
      <div class="nav-label">Il gioco</div>
      <nav class="nav" aria-label="Navigazione">
        <button data-go="#/" data-nav="home"><span class="nav-icon">★</span>Lega generale</button>
        <button data-go="#/leghe" data-nav="leghe"><span class="nav-icon">◎</span>Le mie leghe</button>
        <button data-go="#/classi" data-nav="classi"><span class="nav-icon">▦</span>Classi</button>
        <button data-go="#/catalogo" data-nav="catalogo"><span class="nav-icon">♫</span>Catalogo</button>
        <button data-go="#/regolamento" data-nav="regolamento"><span class="nav-icon">§</span>Regolamento</button>
      </nav>
      <div class="side-note"><strong>Solo con il tuo consenso.</strong>Compari come attore solo nella classe che hai scelto tu, e solo chi ha accesso a quella classe può scommettere sul tuo ruolo.</div>
    </aside>
    <main>
      <div class="topline"><div class="crumb" id="crumb">Fantamusical</div><div id="user-slot"></div></div>
      <div id="view"></div>
    </main>
  </div>
  <div id="toast-root" aria-live="polite"></div>
  <script src="config.js"></script>
  <script>
    (() => {

      const configured = !CONFIG.GOOGLE_CLIENT_ID.startsWith('INCOLLA') && !CONFIG.API_URL.startsWith('INCOLLA');
      const TOKEN_KEY = 'fantamusical-session';
