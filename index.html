      // Typo-tolerant search: each query word must appear in the text, or be within one edit of a word (or word prefix) there.
      function withinOneEdit(a, b) {
        if (Math.abs(a.length - b.length) > 1) return false;
        let i = 0, j = 0, edits = 0;
        while (i < a.length && j < b.length) {
          if (a[i] === b[j]) { i++; j++; continue; }
          if (++edits > 1) return false;
          // Two swapped neighbours ("wikced" vs "wicked") count as a single typo.
          if (a.length === b.length && a[i] === b[j + 1] && a[i + 1] === b[j]) { i += 2; j += 2; continue; }
          if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
        }
        return edits + (a.length - i) + (b.length - j) <= 1;
      }
      function matchesQuery(text, query) {
        const words = text.split(/[^a-z0-9]+/).filter(Boolean);
        return query.split(/\s+/).filter(Boolean).every(token => text.includes(token)
          || (token.length >= 4 && words.some(word => withinOneEdit(token, word) || withinOneEdit(token, word.slice(0, token.length)))));
      }
      function filterCatalog() {
        const query = normalizeSearch(catalogQuery.trim());
        let visible = 0;
        view.querySelectorAll('.catalog-card').forEach(card => { card.hidden = Boolean(query) && !matchesQuery(card.dataset.search, query); if (!card.hidden) visible++; });
        const none = document.getElementById('catalog-none');
        if (none) none.hidden = visible > 0;
      }

      /* ---------- Searchable dropdowns ----------
         Every long <select> rendered in the view is paired with a text field that filters its options as you type
         (same typo-tolerant search as the catalogue). The <select> stays in the DOM, hidden, as the source of truth:
         choosing an item sets its value and fires the usual "change" event, so the rest of the app is unchanged. */
      const COMBO_MIN_OPTIONS = 6;
      const COMBO_MAX_RESULTS = 80;

      function enhanceSelects(root) {
        root.querySelectorAll('select:not([data-combo])').forEach(select => {
          if (select.options.length < COMBO_MIN_OPTIONS) return;
          select.dataset.combo = '1';
          const options = [...select.options].map(o => ({ value: o.value, text: o.text, disabled: o.disabled, search: normalizeSearch(o.text) }));
          const placeholder = options[0]?.value === '' ? options[0].text : 'Cerca…';
          const choices = options.filter(o => o.value !== '');
          const label = select.id ? document.querySelector(`label[for="${select.id}"]`) : null;

          const wrap = document.createElement('div');
          wrap.className = 'combo';
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'combo-input';
          input.autocomplete = 'off';
          input.spellcheck = false;
          input.placeholder = placeholder;
          input.disabled = select.disabled;
          input.setAttribute('role', 'combobox');
          input.setAttribute('aria-autocomplete', 'list');
          input.setAttribute('aria-expanded', 'false');
          input.setAttribute('aria-label', select.getAttribute('aria-label') || label?.textContent.trim() || placeholder);
          const list = document.createElement('ul');
          list.className = 'combo-list';
          list.setAttribute('role', 'listbox');
          list.hidden = true;
          select.before(wrap);
          wrap.append(input, list, select);
          select.hidden = true;
          // A hidden required <select> would silently block form submission: the visible field carries "required".
          if (select.required) { select.required = false; input.required = true; }
          if (label) label.addEventListener('click', event => { event.preventDefault(); input.focus(); });

          const selectedText = () => options.find(o => o.value === select.value && o.value !== '')?.text || '';
          input.value = selectedText();
          let shown = [];
          let active = -1;

          const highlight = (text, query) => {
            const words = query.split(/\s+/).filter(Boolean);
            if (!words.length) return esc(text);
            const norm = normalizeSearch(text);
            const marks = new Array(text.length).fill(false);
            words.forEach(word => { let i = norm.indexOf(word); while (i >= 0) { for (let k = i; k < i + word.length; k++) marks[k] = true; i = norm.indexOf(word, i + word.length); } });
            return [...text].map((ch, i) => (marks[i] && !marks[i - 1] ? '<mark>' : '') + esc(ch) + (marks[i] && !marks[i + 1] ? '</mark>' : '')).join('');
          };
          function render(query) {
            const q = normalizeSearch(query.trim());
            const matches = q ? choices.filter(o => matchesQuery(o.search, q)) : choices;
            // Exact prefix matches first, then the rest in their original order.
            shown = q ? [...matches.filter(o => o.search.startsWith(q)), ...matches.filter(o => !o.search.startsWith(q))] : matches;
            shown = shown.slice(0, COMBO_MAX_RESULTS);
            const canClear = select.value !== '' && options[0]?.value === '' && !q;
            if (canClear) shown = [{ value: '', text: 'Nessuna scelta', clear: true }, ...shown];
            active = shown.findIndex(o => !o.disabled && !o.clear && (q || o.value === select.value));
            if (active < 0) active = shown.findIndex(o => !o.disabled);
            list.innerHTML = shown.length
              ? shown.map((o, i) => `<li role="option" data-i="${i}" class="${[o.disabled && 'disabled', o.clear && 'clear', i === active && 'active', o.value === select.value && o.value && 'selected'].filter(Boolean).join(' ')}">${o.clear ? esc(o.text) : highlight(o.text, q)}</li>`).join('')
                + (q && matches.length > COMBO_MAX_RESULTS ? `<li class="empty">…e altri ${matches.length - COMBO_MAX_RESULTS}: continua a scrivere</li>` : '')
              : '<li class="empty">Nessun risultato</li>';
            list.hidden = false;
            input.setAttribute('aria-expanded', 'true');
            list.querySelector('li.active')?.scrollIntoView?.({ block: 'nearest' });
          }
          function close(restore) {
            list.hidden = true;
            input.setAttribute('aria-expanded', 'false');
            if (restore) input.value = selectedText();
          }
          function choose(i) {
            const option = shown[i];
            if (!option || option.disabled) return;
            close(false);
            input.value = option.clear ? '' : option.text;
            if (select.value === option.value) return;
            select.value = option.value;
            select.dispatchEvent(new Event('change', { bubbles: true }));
          }
          function move(step) {
            if (list.hidden) { render(''); return; }
            if (!shown.length) return;
            let next = active;
            for (let n = 0; n < shown.length; n++) {
              next = (next + step + shown.length) % shown.length;
              if (!shown[next].disabled) break;
            }
            active = next;
            list.querySelectorAll('li').forEach(li => li.classList.toggle('active', Number(li.dataset.i) === active));
            list.querySelector('li.active')?.scrollIntoView?.({ block: 'nearest' });
          }

          input.addEventListener('focus', () => { input.select(); render(''); });
          input.addEventListener('click', () => { if (list.hidden) render(''); });
          input.addEventListener('input', () => render(input.value));
          input.addEventListener('blur', () => setTimeout(() => close(true), 120));
          input.addEventListener('keydown', event => {
            if (event.key === 'ArrowDown') { event.preventDefault(); move(1); }
            else if (event.key === 'ArrowUp') { event.preventDefault(); move(-1); }
            else if (event.key === 'Enter') { if (!list.hidden) { event.preventDefault(); choose(active); } }
            else if (event.key === 'Escape') { close(true); input.blur(); }
          });
          // mousedown (not click) so the choice happens before the input loses focus.
          list.addEventListener('mousedown', event => {
            event.preventDefault();
            const li = event.target.closest('li[data-i]');
            if (li) choose(Number(li.dataset.i));
          });
        });
      }
      // Views are re-rendered with innerHTML: enhance any new <select> as soon as it appears.
      new MutationObserver(() => enhanceSelects(view)).observe(view, { childList: true, subtree: true });

      /* ---------- Events ---------- */
      const castOf = kind => rank => (kind === 'result' ? resultDraft.cast : draft[Number(rank)].cast);

      document.addEventListener('click', event => {
        const go = event.target.closest('[data-go]');
        if (go) { location.hash = go.dataset.go; return; }
        const button = event.target.closest('[data-action]');
        if (!button) return;
        event.preventDefault();
        const action = button.dataset.action;
        if (action === 'logout') return signOut(false);
        if (action === 'retry') return boot();
        // Local edit-mode switches (no server call).
        const local = {
          'edit-general': () => { editingGeneral = true; renderGeneral(); },
          'rank-mode': () => {
            const type = button.dataset.mode;
            const own = me.user.classId;
            rankMode = { type, value: type === 'class' ? own : type === 'day' ? own.slice(0, 3) : '' };
            renderGeneral();
          },
          'cancel-general': () => { resetGeneralDraft(); renderGeneral(); },
          'edit-team': () => { editingTeam = true; renderMyClass(); },
          'cancel-team': () => { resetTeamDraft(); renderMyClass(); },
          'edit-result': () => { editingResult = true; renderMyClass(); },
          'cancel-result': () => { resetResultDraft(); renderMyClass(); },
          'add-extra': () => {
            const cast = castOf(button.dataset.kind)(button.dataset.rank);
            const role = button.dataset.role;
            const ids = cast[role] || [];
            let n = 1;
            while (ids.includes(`extra:${n}`)) n++;
            cast[role] = [...ids, `extra:${n}`].slice(0, MAX_ACTORS);
            renderMyClass();
          },
          'unpick': () => {
            const cast = castOf(button.dataset.kind)(button.dataset.rank);
            const role = button.dataset.role;
            cast[role] = (cast[role] || []).filter(id => id !== button.dataset.id);
            if (!cast[role].length) delete cast[role];
            renderMyClass();
          }
        };
        if (local[action]) return local[action]();
        const handlers = {
          'reload': async () => { await loadMyClass(); renderMyClass(); },
          'save-result': async () => {
            if (!resultDraft.musicalKey) { toast('Seleziona il musical assegnato.'); return; }
            if (!cls.result && !confirm('Pubblicando il risultato le squadre della classe si chiudono e vengono calcolati i punti. Continuare?')) return;
            await api('saveClassResult', { result: resultDraft }); await loadMyClass(); general = null; refreshMe().catch(() => {});
            renderMyClass(); toast('Risultato pubblicato.');
          },
          'reopen': async () => {
            if (!confirm('Il risultato verrà cancellato e le squadre della classe torneranno modificabili. Continuare?')) return;
            await api('saveClassResult', { result: null }); await loadMyClass(); general = null; refreshMe().catch(() => {});
            renderMyClass(); toast('Risultato annullato.');
          },
          'delete-profile': async () => {
            if (!confirm('Eliminare il profilo? Sparirai dagli attori della tua classe e verranno cancellate tutte le tue squadre. L’operazione non si può annullare.')) return;
            await api('deleteProfile'); toast('Profilo eliminato.'); signOut(false);
          }
        };
        if (handlers[action]) withBusy(button, handlers[action]);
      });

      view.addEventListener('input', event => {
        if (event.target.id === 'catalog-search') { catalogQuery = event.target.value; filterCatalog(); }
        if (event.target.id === 'general-name' && generalDraft) generalDraft.name = event.target.value;
        if (event.target.id === 'team-name') teamName = event.target.value;
      });

      view.addEventListener('change', event => {
        const target = event.target;
        if (target.dataset.generalClass !== undefined) {
          const i = Number(target.dataset.generalClass);
          generalDraft.picks[i] = target.value ? { classId: target.value, musicalKey: generalDraft.picks[i]?.musicalKey || '' } : null;
          renderGeneral(); return;
        }
        if (target.dataset.generalJolly !== undefined) { generalDraft.jolly = target.value; return; }
        if (target.id === 'rank-filter') { rankMode.value = target.value; renderGeneral(); return; }
        if (target.dataset.generalMusical !== undefined) {
          const i = Number(target.dataset.generalMusical);
          if (generalDraft.picks[i]) generalDraft.picks[i].musicalKey = target.value;
          return;
        }
        if (target.dataset.musicalRank !== undefined) {
          const rank = Number(target.dataset.musicalRank);
          const roles = catalogByKey.get(target.value)?.roles || [];
          const oldCast = draft[rank].cast || {};
          draft[rank] = { musicalKey: target.value, cast: Object.fromEntries(roles.filter(role => oldCast[role]).map(role => [role, oldCast[role]])) };
          renderMyClass(); return;
        }
        if (target.dataset.pick && target.value) {
          const cast = castOf(target.dataset.pick)(target.dataset.rank);
          const role = target.dataset.role;
          cast[role] = [...new Set([...(cast[role] || []), target.value])].slice(0, MAX_ACTORS);
          renderMyClass(); return;
        }
        if (target.id === 'result-musical') {
          const roles = catalogByKey.get(target.value)?.roles || [];
          resultDraft = { musicalKey: target.value, cast: Object.fromEntries(roles.filter(role => resultDraft.cast[role]).map(role => [role, resultDraft.cast[role]])) };
          renderMyClass();
        }
      });

      view.addEventListener('submit', event => {
        event.preventDefault();
        const form = event.target;
        const button = form.querySelector('button[type="submit"]');
        const data = new FormData(form);
        if (form.id === 'profile-form') return withBusy(button, async () => {
          const first = !me.onboarded;
          const classId = data.get('classId');
          if (first && !confirm(`Confermi di essere in ${classId}? La classe non si potrà più cambiare.`)) return;
          await api('saveProfile', { name: data.get('name'), classId, consent: data.get('consent') === 'on' });
          await refreshMe(); general = null; cls = null;
          toast(first ? `Benvenuto in scena, ${me.user.name}!` : 'Profilo aggiornato.');
          if (onPage('')) route(); else location.hash = '#/';
        });
        if (form.id === 'general-form') return withBusy(button, async () => {
          const picks = generalDraft.picks.map(p => (p && p.classId && p.musicalKey ? p : null));
          if (!generalDraft.picks[0]?.musicalKey && !general.teams.find(t => t.mine)?.hits?.[0] && !resultOfClass(me.user.classId)) { toast(`La prima scelta è obbligatoria: scegli il musical di ${me.user.classId}.`); return; }
          if (generalDraft.picks.some(p => p && p.classId && !p.musicalKey)) { toast('Scegli il musical per ogni classe selezionata.'); return; }
          if (!picks.some(Boolean)) { toast('Scegli almeno una classe e il suo musical.'); return; }
          await api('saveGeneralTeam', { name: data.get('name'), picks, jolly: generalDraft.jolly || null });
          await loadGeneral(); renderGeneral(); toast('Squadra salvata.');
        });
        if (form.id === 'team-form') return withBusy(button, async () => {
          const choices = draft.filter(choice => choice.musicalKey);
          if (!choices.length) { toast('Scegli almeno un musical.'); return; }
          if (new Set(choices.map(c => c.musicalKey)).size !== choices.length) { toast('Scegli musical diversi.'); return; }
          await api('saveClassTeam', { name: data.get('name'), choices });
          await loadMyClass(); refreshMe().catch(() => {});
          renderMyClass(); toast('Squadra salvata.');
        });
        if (form.id === 'musical-form') return withBusy(button, async () => {
          const title = String(data.get('title')).trim();
          const roles = String(data.get('roles') || '').split(',').map(r => r.trim()).filter(Boolean);
          if (catalogByKey.has(musicalKey(title)) && !roles.length) { toast('Questo musical è già nel catalogo.'); return; }
          applyCatalogEntry(await api('catalogUpsert', { title, roles }));
          catalogQuery = title; renderCatalog(); toast('Catalogo aggiornato.');
        });
        if (form.dataset.addRole) return withBusy(button, async () => {
          const musical = catalogByKey.get(form.dataset.addRole);
          const role = String(data.get('role')).trim();
          if (!musical || musical.roles.some(r => musicalKey(r) === musicalKey(role))) { toast('Ruolo già presente.'); return; }
          applyCatalogEntry(await api('catalogUpsert', { title: musical.title, roles: [role] }));
          renderCatalog(); toast('Ruolo aggiunto.');
        });
      });

      /* ---------- Start ---------- */
      const saved = storage.get(TOKEN_KEY);
      if (configured && saved?.token && saved.exp * 1000 > Date.now() + 60000) { session = saved; boot(); }
      else route();
    })();
  </script>
  <script src="https://accounts.google.com/gsi/client" async></script>
</body>
