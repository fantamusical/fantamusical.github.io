<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ed">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Fantamusical | Pronostici di classe</title>
  <style>

    :root {
      color-scheme: light;
      --paper: #f4f3ed;
      --surface: #fffefa;
      --ink: #20342e;
      --muted: #6d7871;
      --line: #dfe3d9;
      --green: #245c48;
      --green-dark: #183e32;
      --lime: #d9ef84;
      --coral: #e87860;
      --gold: #d8a947;
      --shadow: 0 12px 34px rgba(32, 52, 46, .07);
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --sans: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); font: 14px/1.5 var(--sans); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .shell { display: grid; grid-template-columns: 238px minmax(0, 1fr); min-height: 100vh; }
    aside { position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh; padding: 27px 18px 20px; color: #f5f4ed; background: var(--green-dark); }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 9px 36px; }
    .brand-mark { display: grid; width: 39px; height: 39px; place-items: center; color: var(--green-dark); background: var(--lime); border-radius: 12px 12px 12px 3px; font: bold 22px var(--serif); }
    .brand-name { font: 21px/1 var(--serif); letter-spacing: 0; }
    .brand-caption { margin-top: 5px; color: #a9bbb0; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .nav-label { padding: 0 10px 10px; color: #91a79a; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .nav { display: grid; gap: 5px; }
    .nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; color: #c8d3cc; background: transparent; border: 0; border-radius: 8px; text-align: left; transition: background .16s, color .16s; }
    .nav button:hover, .nav button.active { color: white; background: rgba(255,255,255,.1); }
    .nav button.active { box-shadow: inset 3px 0 var(--lime); }
    .nav-icon { display: grid; width: 19px; place-items: center; font-size: 17px; }
    .side-note { margin-top: auto; padding: 14px 13px; color: #b6c4bb; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; font-size: 11px; }
    .side-note strong { display: block; margin-bottom: 4px; color: var(--lime); font-size: 12px; }
    main { min-width: 0; padding: 36px clamp(20px, 5vw, 68px) 60px; background-image: radial-gradient(rgba(36,92,72,.055) .7px, transparent .7px); background-size: 18px 18px; }
    .topline { display: flex; justify-content: space-between; align-items: center; gap: 16px; max-width: 1120px; margin: 0 auto 34px; }
    .crumb { color: var(--muted); font-size: 12px; }
    .round-label { display: flex; align-items: center; gap: 8px; padding: 7px 11px; color: var(--green); background: #e9efe1; border-radius: 99px; font-size: 11px; font-weight: 650; }
    .round-dot { width: 7px; height: 7px; background: #7eaa50; border-radius: 50%; }
    #view { max-width: 1120px; margin: 0 auto; }
    .page-heading { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 27px; }
    .eyebrow { margin-bottom: 7px; color: var(--green); font-size: 10px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font: 42px/1.05 var(--serif); letter-spacing: 0; }
    .intro { max-width: 550px; margin: 9px 0 0; color: var(--muted); }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 39px; padding: 0 15px; color: white; background: var(--green); border: 1px solid var(--green); border-radius: 6px; font-weight: 650; transition: background .15s, transform .15s; }
    .button:hover { background: var(--green-dark); transform: translateY(-1px); }
    .button.secondary { color: var(--ink); background: var(--surface); border-color: var(--line); }
    .button.secondary:hover { background: #f0f3eb; }
    .button.small { min-height: 32px; padding: 0 11px; font-size: 12px; }
    .button .plus { font-size: 18px; line-height: 0; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; margin-bottom: 25px; }
    .stat { display: flex; align-items: center; justify-content: space-between; min-height: 104px; padding: 19px 21px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { margin-top: 3px; font: 32px/1 var(--serif); }
    .stat-mark { display: grid; width: 38px; height: 38px; place-items: center; color: var(--green); background: #edf2e8; border-radius: 50%; font-size: 18px; }
    .columns { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(270px, .8fr); gap: 16px; }
    .panel { min-width: 0; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    h2 { margin: 0; font: 22px/1.15 var(--serif); }
    h3 { margin: 0; font-size: 13px; }
    .subtle { color: var(--muted); font-size: 12px; }
    .leader-row { display: grid; grid-template-columns: 29px minmax(0, 1fr) auto; align-items: center; gap: 11px; padding: 12px 0; border-top: 1px solid #edf0e9; }
    .leader-row:first-child { border-top: 0; }
    .rank-number { color: #86928b; font: 17px var(--serif); }
    .person-name { font-weight: 680; }
    .score { color: var(--green); font-weight: 750; }
    .empty { padding: 27px 12px; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 5px; color: var(--ink); font: 19px var(--serif); }
    .steps { display: grid; gap: 0; }
    .step { display: grid; grid-template-columns: 27px 1fr; gap: 11px; padding: 13px 0; border-top: 1px solid #edf0e9; }
    .step:first-child { border-top: 0; }
    .step-num { display: grid; width: 25px; height: 25px; place-items: center; color: var(--green); background: #eaf0e4; border-radius: 50%; font-size: 11px; font-weight: 700; }
    .step p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .field { display: grid; gap: 6px; min-width: 0; }
    .field label, .field-label { color: #536159; font-size: 11px; font-weight: 700; }
    input, select { width: 100%; min-width: 0; height: 39px; padding: 0 11px; color: var(--ink); background: #fff; border: 1px solid #d8dfd5; border-radius: 5px; outline: none; }
    input:focus, select:focus { border-color: #6b977c; box-shadow: 0 0 0 3px rgba(36,92,72,.1); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; padding: 15px; margin-bottom: 17px; background: #f0f2eb; border-radius: 7px; }
    .toolbar .field { flex: 1 1 190px; }
    .choice-list { display: grid; gap: 13px; }
    .choice-card { overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .choice-top { display: grid; grid-template-columns: 35px minmax(0,1fr); align-items: center; gap: 12px; padding: 15px 17px; background: #fbfbf7; border-bottom: 1px solid #edf0e9; }
    .choice-rank { display: grid; width: 33px; height: 33px; place-items: center; color: #293d33; background: var(--lime); border-radius: 50%; font: 18px var(--serif); }
    .choice-top .field { grid-template-columns: auto minmax(0,1fr); align-items: center; gap: 13px; }
    .cast-wrap { padding: 15px 17px 17px; }
    .cast-heading { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .cast-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px 13px; }
    .cast-grid .field { gap: 4px; }
    .cast-grid label { font-size: 10px; }
    .form-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 16px; }
    .form-message { color: var(--muted); font-size: 12px; }
    .class-list { display: grid; gap: 13px; }
    .class-card, .catalog-card { padding: 17px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .student-list { display: flex; flex-wrap: wrap; gap: 7px; margin: 13px 0; }
    .student-chip { padding: 5px 9px; color: #3e5548; background: #edf2e9; border-radius: 4px; font-size: 11px; }
    .inline-form { display: flex; gap: 8px; margin-top: 12px; }
    .inline-form input { flex: 1; }
    .catalog-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .role-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 11px 0 14px; }
    .role-chip { padding: 4px 8px; color: #61513a; background: #f5efdf; border: 1px solid #ede5d0; border-radius: 4px; font-size: 10px; }
    .catalog-card .inline-form { align-items: center; }
    .catalog-card .inline-form input { height: 34px; }
    .result-selectors { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; padding: 15px; margin-bottom: 14px; background: #f0f2eb; border-radius: 7px; }
    .result-cast { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 11px 14px; margin-top: 16px; }
    .score-legend { padding: 14px 15px; color: #59665d; background: #eff3e8; border-left: 3px solid var(--lime); border-radius: 3px; font-size: 12px; }
    .score-legend strong { color: var(--ink); }
    .board-row { display: grid; grid-template-columns: 34px minmax(0,1fr) 75px 85px; align-items: center; gap: 10px; padding: 13px 5px; border-top: 1px solid #edf0e9; }
    .board-row.board-head { color: var(--muted); border-top: 0; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .board-score { text-align: right; font-weight: 750; }
    .board-classes { color: var(--muted); text-align: right; font-size: 11px; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 5; padding: 11px 16px; color: white; background: var(--green-dark); border-radius: 5px; box-shadow: var(--shadow); animation: rise .2s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .mobile-brand { display: none; }
    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; }
      aside { position: sticky; z-index: 3; top: 0; display: block; width: 100%; height: auto; padding: 10px 14px 0; }
      .brand { display: none; }
      .mobile-brand { display: flex; align-items: center; gap: 9px; padding: 3px 5px 10px; font: 18px var(--serif); }
      .mobile-brand .brand-mark { width: 29px; height: 29px; font-size: 17px; }
      .nav-label, .side-note { display: none; }
      .nav { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 9px; }
      .nav button { flex: 0 0 auto; justify-content: center; width: auto; padding: 8px 10px; font-size: 11px; }
      .nav button.active { box-shadow: inset 0 -2px var(--lime); }
      .nav-icon { display: none; }
      main { padding: 22px 18px 42px; }
      .topline { margin-bottom: 24px; }
      h1 { font-size: 36px; }
      .columns { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .page-heading { align-items: start; flex-direction: column; gap: 15px; }
      .stats { gap: 8px; }
      .stat { min-height: 87px; padding: 13px 11px; }
      .stat-label { font-size: 10px; }
      .stat-value { font-size: 27px; }
      .stat-mark { width: 30px; height: 30px; font-size: 14px; }
      .panel { padding: 16px; }
      .form-grid, .cast-grid, .catalog-grid, .result-selectors, .result-cast { grid-template-columns: 1fr; }
      .choice-top { padding: 12px; }
      .choice-top .field { grid-template-columns: 1fr; gap: 5px; }
      .cast-wrap { padding: 13px 12px; }
      .board-row { grid-template-columns: 26px minmax(0,1fr) 57px; gap: 7px; }
      .board-row > :last-child { display: none; }
      .board-row.board-head > :last-child { display: none; }
    }
    /* ---- Fantamusical online additions ---- */
    body:not(.signed-in) .nav, body:not(.signed-in) .nav-label, body:not(.signed-in) .user-chip { display: none; }
    .user-chip { display: flex; align-items: center; gap: 9px; padding: 4px 4px 4px 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; font-size: 12px; }
    .user-chip span { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .avatar { width: 26px; height: 26px; flex: 0 0 auto; border-radius: 50%; object-fit: cover; background: #e6ece1; }
    .avatar.fallback { display: grid; place-items: center; color: var(--green); font-size: 11px; font-weight: 700; }
    .tabs { display: flex; gap: 4px; margin-bottom: 18px; padding: 4px; overflow-x: auto; background: #e9eee3; border-radius: 8px; }
    .tabs button { flex: 0 0 auto; padding: 8px 14px; color: #4d5c53; background: transparent; border: 0; border-radius: 6px; font-weight: 650; }
    .tabs button.active { color: var(--ink); background: var(--surface); box-shadow: 0 1px 3px rgba(32,52,46,.12); }
    .badge { display: inline-grid; min-width: 19px; height: 19px; place-items: center; margin-left: 6px; padding: 0 5px; color: white; background: var(--coral); border-radius: 99px; font-size: 10px; font-weight: 750; }
    .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .class-link { display: block; padding: 17px; color: inherit; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); transition: transform .15s, border-color .15s; }
    .class-link:hover { border-color: #b8cbb9; transform: translateY(-2px); }
    .class-link h3 { font: 20px/1.2 var(--serif); }
    .class-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; color: var(--muted); font-size: 12px; }
    .code { padding: 2px 6px; color: var(--green-dark); background: #edf2e8; border-radius: 4px; font: 600 12px ui-monospace, Consolas, monospace; letter-spacing: .06em; }
    .person-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid #edf0e9; }
    .person-row:first-child { border-top: 0; }
    .person-row .grow { flex: 1; min-width: 0; }
    .person-row .actions { display: flex; gap: 6px; }
    .status-ok { color: var(--green); font-size: 12px; font-weight: 650; }
    .status-wait { color: var(--muted); font-size: 12px; }
    .link-box { display: flex; gap: 8px; }
    .link-box input { flex: 1; font: 12px ui-monospace, Consolas, monospace; }
    .student-chip { display: inline-flex; align-items: center; gap: 6px; }
    .chip-x { padding: 0 2px; color: #7a8a80; background: none; border: 0; font-size: 14px; line-height: 1; }
    .chip-x:hover { color: var(--coral); }
    .notice { padding: 13px 15px; margin-bottom: 15px; color: #5b4a22; background: #fbf3dc; border: 1px solid #f0e2b6; border-radius: 6px; font-size: 13px; }
    .login-card { max-width: 520px; margin: 6vh auto 0; padding: 34px 30px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
    .login-card h1 { margin-bottom: 10px; }
    .login-card .intro { margin: 0 auto 24px; }
    #google-button { display: flex; justify-content: center; min-height: 44px; }
    .picks { margin: 6px 0 0 39px; color: var(--muted); font-size: 12px; }
    .picks b { color: var(--ink); font-weight: 650; }
    .board-row.compact { grid-template-columns: 34px minmax(0,1fr) 75px; }
    .button:disabled { opacity: .55; cursor: wait; transform: none; }
    .button.danger { color: #9b3a26; background: var(--surface); border-color: #efc9bf; }
    .two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    a.inline { color: var(--green); }
    .rules .step { padding: 18px 0; }
    .rules p { margin: 6px 0 0; color: #45544b; }
    .rules ul { margin: 8px 0 0; padding-left: 18px; color: #45544b; }
    .rules li { margin: 4px 0; }
    @media (max-width: 820px) { .two-col { grid-template-columns: 1fr; } .user-chip span { display: none; } }
  </style>
</head>

      const toast = message => {
        const root = document.getElementById('toast-root');
        root.innerHTML = `<div class="toast">${esc(message)}</div>`;
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => { root.innerHTML = ''; }, 3200);
      };
      const heading = (eyebrow, title, intro, action = '') => `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${esc(title)}</h1>${intro ? `<p class="intro">${intro}</p>` : ''}</div>${action}</div>`;
      const avatar = person => person?.picture
        ? `<img class="avatar" src="${esc(person.picture)}" alt="" referrerpolicy="no-referrer">`
        : `<span class="avatar fallback">${esc((person?.name || '?').slice(0, 1).toUpperCase())}</span>`;
      const titleOf = key => catalogByKey.get(key)?.title || key || '—';
      const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
      const renderLoading = text => { view.innerHTML = `<section class="panel empty"><strong>${esc(text || 'Caricamento…')}</strong>Un attimo di pazienza.</section>`; };
      async function withBusy(button, fn) {
        if (button) button.disabled = true;
        try { await fn(); } catch (error) { if (error?.message) toast(error.message); } finally { if (button) button.disabled = false; }
      }

      /* ---------- Catalogue: built-in seed + additions saved on the server ---------- */
      function buildCatalog(extras) {
        const map = new Map();
        seedCatalog.forEach(([title, roles]) => map.set(musicalKey(title), { key: musicalKey(title), title, roles: roles ? roles.split(', ') : [] }));
        (extras || []).forEach(mergeCatalogEntry.bind(null, map));
        catalogByKey = map;
        catalog = [...map.values()].sort(byTitle);
      }
      function mergeCatalogEntry(map, entry) {
        const existing = map.get(entry.key);
        if (!existing) { map.set(entry.key, { key: entry.key, title: entry.title, roles: [...entry.roles] }); return; }
        entry.roles.forEach(role => { if (!existing.roles.some(r => musicalKey(r) === musicalKey(role))) existing.roles.push(role); });
      }
      function applyCatalogEntry(entry) {
        mergeCatalogEntry(catalogByKey, entry);
        catalog = [...catalogByKey.values()].sort(byTitle);
      }

      /* ---------- Google sign-in ---------- */
      function decodeJwt(token) {
        const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        const bytes = Uint8Array.from(atob(base64), ch => ch.charCodeAt(0));
        return JSON.parse(new TextDecoder().decode(bytes));
      }
      function onCredential(response) {
        const claims = decodeJwt(response.credential);
        session = { token: response.credential, exp: claims.exp, name: claims.name || claims.email, picture: claims.picture || '' };
        storage.set(TOKEN_KEY, session);
        boot();
      }
      function signOut(expired) {
        session = null; me = null; current = null;
        storage.remove(TOKEN_KEY);
        if (gisLoaded) google.accounts.id.disableAutoSelect();
        document.body.classList.remove('signed-in');
        renderLogin(expired ? 'La sessione è scaduta: accedi di nuovo.' : '');
      }
      window.onGoogleLibraryLoad = () => {
        if (!configured) return;
        gisLoaded = true;
        google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: onCredential, auto_select: true, cancel_on_tap_outside: false, use_fedcm_for_prompt: true });
        if (!session) showGoogleButton();
      };
      function showGoogleButton() {
        const slot = document.getElementById('google-button');
        if (!slot || !gisLoaded) return;
        google.accounts.id.renderButton(slot, { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'it' });
        google.accounts.id.prompt();
      }

      /* ---------- Server calls ---------- */
      async function api(action, payload = {}) {
        if (!session || session.exp * 1000 < Date.now() + 30000) { signOut(true); throw new Error(''); }
        let out;
        try {
          // Plain-text body keeps this a "simple" CORS request, which Apps Script web apps accept.
          const res = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ idToken: session.token, action, payload }) });
          out = await res.json();
        } catch {
          throw new Error('Impossibile contattare il server. Controlla la connessione e riprova.');
        }
        if (!out.ok) {
          if (out.code === 'auth') { signOut(true); throw new Error(''); }
          const error = new Error(out.error || 'Errore imprevisto.');
          error.code = out.code;
          throw error;
        }
        return out.data;
      }
      const refreshMe = async () => { me = await api('me'); renderUser(); };

      /* ---------- Boot & routing ---------- */
      async function boot() {
        document.body.classList.add('signed-in');
        renderUser();
        renderLoading('Accesso in corso…');
        try {
          const [meData, extras] = await Promise.all([api('me'), api('catalog')]);
          me = meData;
          buildCatalog(extras);
        } catch (error) {
          if (session) view.innerHTML = `<section class="panel empty"><strong>Qualcosa non va</strong>${esc(error.message)}<br><br><button class="button" data-action="retry">Riprova</button></section>`;
          return;
        }
        renderUser();
        const join = new URLSearchParams(location.search).get('join');
        if (join) {
          history.replaceState(null, '', location.pathname + location.hash);
          try {
            const joined = await api('joinWithInvite', { code: join });
            toast(joined.already ? `Fai già parte di ${joined.name}.` : `Benvenuto in ${joined.name}!`);
            await refreshMe();
            history.replaceState(null, '', `${location.pathname}#/classe/${joined.id}`);
          } catch (error) { if (error.message) toast(error.message); }
        }
        route();
      }

      function route() {
        const [, page, id, tab] = location.hash.replace(/^#/, '').split('/');
        if (page === 'regolamento' && !me) return renderRules();   // readable before signing in too
        if (!session) return renderLogin();
        if (!me) return;
        const section = ['catalogo', 'regolamento'].includes(page) ? page : 'home';
        document.querySelectorAll('.nav [data-nav]').forEach(button => button.classList.toggle('active', button.dataset.nav === section));
        if (page === 'catalogo') return renderCatalog();
        if (page === 'regolamento') return renderRules();
        if (page === 'classe' && id) return openClass(id.toUpperCase(), tab);
        renderHome();
      }
      window.addEventListener('hashchange', route);

      /* ---------- Views ---------- */
      function renderUser() {
        const slot = document.getElementById('user-slot');
        slot.innerHTML = session ? `<div class="user-chip">${avatar(session)}<span>${esc(session.name)}</span><button class="button secondary small" data-action="logout">Esci</button></div>` : '';
      }

      function renderLogin(message = '') {
        document.getElementById('crumb').textContent = 'Fantamusical';
        renderUser();
        view.innerHTML = `<div class="login-card">
          <div class="eyebrow">Benvenuti sul palco</div>
          <h1>Fantamusical</h1>
          <p class="intro">Il gioco dei pronostici tra amici: indovina quale musical metterà in scena ogni classe e chi interpreterà ogni ruolo.</p>
          ${message ? `<div class="notice">${esc(message)}</div>` : ''}
          ${configured ? '<div id="google-button"></div><p class="subtle" style="margin-top:18px">Usiamo Google solo per riconoscerti: nome, email e foto profilo.<br><a class="inline" href="#/regolamento">Leggi il regolamento</a> · <a class="inline" href="privacy.html">Privacy</a></p>'
                       : '<div class="notice">L’app non è ancora configurata: inserisci <b>GOOGLE_CLIENT_ID</b> e <b>API_URL</b> in cima allo script (vedi SETUP.md).</div>'}
        </div>`;
        showGoogleButton();
      }

      function renderHome() {
        current = null;
        document.getElementById('crumb').innerHTML = 'Fantamusical · <strong>Le mie classi</strong>';
        const cards = me.classes.map(room => `<a class="class-link" href="#/classe/${esc(room.id)}"><h3>${esc(room.name)}</h3>
            <div class="class-meta"><span class="code">${esc(room.id)}</span><span>${plural(room.members, 'membro', 'membri')}</span><span>${room.hasResult ? '✓ Risultato pubblicato' : 'Pronostici aperti'}</span>${room.requests ? `<span class="badge">${room.requests}</span>` : ''}</div></a>`).join('');
        const others = me.others || [];
        const otherRows = others.map(room => `<div class="person-row" data-class-name="${esc(normalizeSearch(room.name))}"><div class="grow"><div class="person-name">${esc(room.name)}</div>
            <div class="subtle">${plural(room.members, 'membro', 'membri')}${room.createdBy ? ` · creata da ${esc(room.createdBy)}` : ''}</div></div>
            ${room.pending
              ? `<span class="status-wait">In attesa di approvazione</span><button class="button secondary small" data-action="cancel-request" data-id="${esc(room.id)}">Annulla</button>`
              : `<button class="button small" data-action="request" data-id="${esc(room.id)}">Chiedi di entrare</button>`}</div>`).join('');
        view.innerHTML = `${heading('Il tuo palcoscenico', 'Le mie classi', 'Ogni classe è un Fantamusical a sé, con i suoi membri, studenti, pronostici e classifica. Il contenuto delle classi lo vede solo chi ne fa parte.')}
          ${me.classes.length ? `<div class="class-grid">${cards}</div>` : `<section class="panel empty" style="margin-bottom:16px"><strong>Nessuna classe per ora</strong>Chiedi di entrare in una classe qui sotto, creane una nuova, oppure apri il link di invito che ti hanno mandato.</section>`}
          <section class="panel" style="margin-bottom:16px"><div class="panel-head"><h2>Altre classi</h2><span class="subtle">${plural(others.length, 'classe', 'classi')}</span></div>
            <p class="subtle" style="margin-top:-6px">Chiedi di entrare: un membro della classe approverà la richiesta. Con un link di invito entri subito.</p>
            ${others.length > 6 ? `<div class="field" style="margin-bottom:6px"><input id="class-search" type="search" placeholder="Cerca una classe" aria-label="Cerca una classe"></div>` : ''}
            ${otherRows || '<p class="subtle">Non ci sono altre classi al momento.</p>'}
            <p id="class-none" class="subtle" hidden>Nessuna classe con questo nome.</p></section>
          <section class="panel"><div class="panel-head"><h2>Crea una classe</h2></div>
            <form id="create-class-form" class="field"><label for="class-name">Nome</label><div class="link-box"><input id="class-name" name="name" maxlength="80" placeholder="Es. 3B Liceo Musicale" required><button class="button" type="submit">Crea</button></div></form>
            <p class="subtle">Diventerai il primo membro e potrai invitare gli altri con un link o approvare le loro richieste.</p></section>`;
      }

      async function openClass(id, tab) {
        currentTab = ['pronostico', 'risultato', 'studenti', 'membri'].includes(tab) ? tab : 'pronostico';
        if (current?.id !== id) {
          renderLoading('Apertura della classe…');
          try { await loadClass(id); } catch (error) {
            if (!session) return;
            view.innerHTML = `<section class="panel empty"><strong>Classe non disponibile</strong>${esc(error.message)}<br><br><a class="button secondary" href="#/">Torna alle mie classi</a></section>`;
            return;
          }
        }
        renderClass();
      }

      async function loadClass(id) {
        current = await api('getClass', { classId: id });
        draft = [0, 1, 2].map(i => structuredClone(current.myBallot?.[i] || { musicalKey: '', cast: {} }));
        resultDraft = structuredClone(current.result || { musicalKey: '', cast: {} });
      }

      function renderClass() {
        const c = current;
        document.getElementById('crumb').innerHTML = `<a class="inline" href="#/">Le mie classi</a> · <strong>${esc(c.name)}</strong>`;
        const tabs = [['pronostico', 'Il mio pronostico'], ['risultato', c.result ? 'Classifica' : 'Risultato'], ['studenti', 'Studenti'], ['membri', 'Membri']]
          .map(([key, label]) => `<button data-tab="${key}" class="${currentTab === key ? 'active' : ''}">${label}${key === 'membri' && c.requests.length ? `<span class="badge">${c.requests.length}</span>` : ''}</button>`).join('');
        const body = { pronostico: tabBallot, risultato: tabResult, studenti: tabStudents, membri: tabMembers }[currentTab]();
        view.innerHTML = `${heading(`Classe · <span class="code">${esc(c.id)}</span>`, c.name, `${plural(c.members.length, 'membro', 'membri')} · ${plural(c.students.length, 'studente', 'studenti')} · ${c.result ? 'risultato pubblicato' : 'pronostici aperti'}`, '<button class="button secondary small" data-action="reload">↻ Aggiorna</button>')}
          <nav class="tabs">${tabs}</nav>${body}`;
        if (currentTab === 'membri') view.querySelector('#invite-link')?.addEventListener('focus', e => e.target.select());
      }

      const musicalOptions = selected => `<option value="">Scegli un musical</option>${catalog.map(m => `<option value="${esc(m.key)}" ${m.key === selected ? 'selected' : ''}>${esc(m.title)}</option>`).join('')}${selected && !catalogByKey.has(selected) ? `<option value="${esc(selected)}" selected>${esc(selected)}</option>` : ''}`;
      const studentOptions = (selected, placeholder) => `<option value="">${placeholder}</option>${current.students.map(s => `<option value="${esc(s.id)}" ${s.id === selected ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}`;

      function tabBallot() {
        const closed = Boolean(current.result);
        const cards = draft.map((choice, index) => {
          const roles = catalogByKey.get(choice.musicalKey)?.roles || [];
          const cast = !choice.musicalKey ? '<div class="subtle">Scegli un musical per comporre il cast.</div>'
            : !roles.length ? '<div class="subtle">Questo musical non ha ancora ruoli: aggiungili dal Catalogo.</div>'
            : !current.students.length ? '<div class="subtle">Aggiungi gli studenti della classe (scheda Studenti) per assegnare i ruoli.</div>'
            : roles.map(role => `<div class="field"><label>${esc(role)}</label><select data-rank="${index}" data-role="${esc(role)}" ${closed ? 'disabled' : ''}>${studentOptions(choice.cast?.[role] || '', 'Scegli uno studente')}</select></div>`).join('');
          return `<article class="choice-card"><div class="choice-top"><div class="choice-rank">${index + 1}</div><div class="field"><label for="musical-${index}">${['Prima scelta', 'Seconda scelta', 'Terza scelta'][index]}</label><select id="musical-${index}" data-musical-rank="${index}" ${closed ? 'disabled' : ''}>${musicalOptions(choice.musicalKey)}</select></div></div>
            <div class="cast-wrap"><div class="cast-heading"><h3>Cast ${index + 1}</h3><span class="subtle">${plural(roles.length, 'ruolo', 'ruoli')}</span></div><div class="cast-grid">${cast}</div></div></article>`;
        }).join('');
        return `${closed ? '<div class="notice">Il risultato ufficiale è stato pubblicato: i pronostici sono chiusi. Guarda la classifica!</div>' : ''}
          <form id="ballot-form"><div class="choice-list">${cards}</div>
          <div class="form-footer"><span class="form-message">${current.myBallot ? 'Hai già inviato un pronostico: puoi modificarlo finché il risultato non viene pubblicato.' : 'Il tuo pronostico resta nascosto agli altri fino al risultato.'}</span>${closed ? '' : '<button class="button" type="submit">Salva pronostico</button>'}</div></form>`;
      }

      function tabResult() {
        const roles = catalogByKey.get(resultDraft.musicalKey)?.roles || [];
        const castFields = !resultDraft.musicalKey ? '<div class="subtle">Seleziona il musical assegnato per inserire il cast.</div>'
          : !current.students.length ? '<div class="subtle">Aggiungi gli studenti della classe per assegnare il cast ufficiale.</div>'
          : roles.map(role => `<div class="field"><label>${esc(role)}</label><select data-result-role="${esc(role)}">${studentOptions(resultDraft.cast?.[role] || '', 'Ruolo non assegnato')}</select></div>`).join('');
        const resultPanel = `<section class="panel" style="margin-bottom:15px"><div class="panel-head"><h2>Esito ufficiale</h2>${current.result ? '<span class="status-ok">✓ Pubblicato</span>' : ''}</div>
          <div class="result-selectors" style="grid-template-columns:1fr"><div class="field"><label for="result-musical">Musical assegnato alla classe</label><select id="result-musical">${musicalOptions(resultDraft.musicalKey)}</select></div></div>
          <div class="result-cast">${castFields}</div>
          <div class="form-footer"><span class="form-message">${current.result ? 'Puoi correggere il risultato o riaprire i pronostici.' : 'Pubblicando il risultato i pronostici si chiudono e diventano visibili a tutti.'}</span>
          <div style="display:flex;gap:8px">${current.result ? '<button class="button danger" data-action="reopen">Riapri pronostici</button>' : ''}<button class="button" data-action="save-result">${current.result ? 'Aggiorna risultato' : 'Pubblica risultato'}</button></div></div></section>`;

        let board;
        if (current.standings) {
          // Equal points share the same position ("pari merito"): 1, 1, 3…
          const positions = current.standings.map((p, i, all) => all.findIndex(other => other.points === p.points) + 1);
          const rows = current.standings.map((p, i) => `<div class="board-row compact" style="grid-template-columns:34px minmax(0,1fr) 75px"><span class="rank-number">${positions[i]}</span><span style="display:flex;align-items:center;gap:9px">${avatar(p)}<span class="person-name">${esc(p.name)}</span></span><span class="board-score">${p.points} pt</span></div>
            <div class="picks">${p.hasBallot ? p.choices.map((ch, k) => `${k + 1}. <b>${esc(titleOf(ch.musicalKey))}</b>${k === p.rank ? ' ✓' : ''}`).join(' · ') : 'Nessun pronostico inviato'}</div>`).join('');
          board = `<section class="panel" style="margin-bottom:15px"><div class="panel-head"><h2>Classifica</h2><span class="subtle">Musical: ${esc(titleOf(current.result.musicalKey))}</span></div>
            <div class="board-row board-head compact" style="grid-template-columns:34px minmax(0,1fr) 75px"><span>#</span><span>Giocatore</span><span class="board-score">Punti</span></div>${rows}</section>`;
        } else {
          const done = current.members.filter(m => m.hasBallot).length;
          board = `<section class="panel" style="margin-bottom:15px"><div class="panel-head"><h2>Chi ha giocato</h2><span class="subtle">${done} su ${current.members.length}</span></div>
            ${current.members.map(m => `<div class="person-row">${avatar(m)}<div class="grow person-name">${esc(m.name)}</div>${m.hasBallot ? '<span class="status-ok">✓ Pronostico inviato</span>' : '<span class="status-wait">Non ancora</span>'}</div>`).join('')}</section>`;
        }
        return `${current.result ? board + resultPanel : resultPanel + board}
          <div class="score-legend"><strong>Punteggio:</strong> musical indovinato: 6 punti se era la prima scelta, 4 la seconda, 2 la terza. Cast: fino a 12 punti in proporzione ai ruoli assegnati correttamente.</div>`;
      }

      function tabStudents() {
        return `<section class="panel"><div class="panel-head"><h2>Studenti della classe</h2><span class="subtle">${plural(current.students.length, 'studente', 'studenti')}</span></div>
          <p class="subtle" style="margin-top:-6px">Sono gli interpreti tra cui scegliere il cast. Tutti i membri possono modificarli.</p>
          <div class="student-list">${current.students.map(s => `<span class="student-chip">${esc(s.name)}<button class="chip-x" title="Rimuovi" data-action="remove-student" data-id="${esc(s.id)}">×</button></span>`).join('') || '<span class="subtle">Nessuno studente ancora.</span>'}</div>
          <form id="student-form" class="inline-form"><input name="name" maxlength="80" placeholder="Nome e cognome dello studente" required><button class="button" type="submit">Aggiungi</button></form></section>`;
      }

      function tabMembers() {
        const link = `${location.origin}${location.pathname}?join=${current.inviteCode}`;
        const requests = current.requests.length ? current.requests.map(r => `<div class="person-row">${avatar(r)}<div class="grow"><div class="person-name">${esc(r.name)}</div><div class="subtle">${esc(r.email)}</div></div>
            <div class="actions"><button class="button small" data-action="approve" data-sub="${esc(r.sub)}">Approva</button><button class="button secondary small" data-action="reject" data-sub="${esc(r.sub)}">Rifiuta</button></div></div>`).join('')
          : '<p class="subtle">Nessuna richiesta in attesa.</p>';
        return `<div class="two-col" style="margin-bottom:16px">
            <section class="panel"><div class="panel-head"><h2>Invita amici</h2></div>
              <div class="field"><label for="invite-link">Link di invito (chi lo apre entra subito)</label><div class="link-box"><input id="invite-link" readonly value="${esc(link)}"><button class="button small" data-action="copy-link">Copia</button></div></div>
              <p class="subtle">Chi non ha il link può trovare la classe nell'elenco e chiedere di entrare: le richieste arrivano qui accanto. <a class="inline" href="#" data-action="new-link">Genera un nuovo link</a> per disattivare quello vecchio.</p></section>
            <section class="panel"><div class="panel-head"><h2>Richieste di accesso</h2>${current.requests.length ? `<span class="badge">${current.requests.length}</span>` : ''}</div>${requests}</section>
          </div>
          <section class="panel"><div class="panel-head"><h2>Membri</h2><span class="subtle">${plural(current.members.length, 'membro', 'membri')}</span></div>
            ${current.members.map(m => `<div class="person-row">${avatar(m)}<div class="grow person-name">${esc(m.name)}${m.sub === me.user.sub ? ' <span class="subtle">(tu)</span>' : ''}</div></div>`).join('')}
            <div class="form-footer"><span class="form-message">Se esce l'ultimo membro, la classe viene eliminata.</span><button class="button danger small" data-action="leave">Esci dalla classe</button></div></section>`;
      }

      function renderRules() {
        if (me) current = null;
        document.getElementById('crumb').innerHTML = 'Fantamusical · <strong>Regolamento</strong>';
        const section = (num, title, body) => `<div class="step"><div class="step-num">${num}</div><div><h3 style="font:19px/1.25 var(--serif)">${title}</h3>${body}</div></div>`;
        const p = text => `<p>${text}</p>`;
        view.innerHTML = `${heading('Le regole del gioco', 'Regolamento', 'Come si partecipa, come si gioca e come si contano i punti.', me ? '' : '<a class="button secondary" href="#/">← Torna all’accesso</a>')}
          <section class="panel rules" style="margin-bottom:16px"><div class="steps">
            ${section(1, 'Lo scopo', p('Ogni classe della scuola mette in scena un musical. Il tuo compito è indovinare <b>quale musical</b> sarà assegnato alla classe e <b>quali studenti</b> interpreteranno i ruoli principali.'))}
            ${section(2, 'Come si partecipa', p('Accedi con il tuo account Google. In una classe si entra in due modi:') + `<ul>
              <li><b>Link di invito</b>: chi ha il link entra subito e può giocare.</li>
              <li><b>Richiesta di accesso</b>: nella pagina <i>Le mie classi</i> trovi l’elenco delle altre classi. Clicchi <i>Chiedi di entrare</i> e un membro della classe approva la richiesta.</li></ul>` + p('Puoi giocare in tutte le classi in cui entri. <b>Ogni classe è un Fantamusical a sé</b>, con i suoi membri, i suoi pronostici e la sua classifica. Tutti vedono il nome delle classi, ma pronostici, studenti e classifica li vede solo chi ne fa parte.'))}
            ${section(3, 'Il pronostico', `<ul>
              <li>Per ogni classe scegli <b>fino a 3 musical diversi</b>, in ordine: prima, seconda e terza scelta.</li>
              <li>Per ciascun musical puoi comporre il <b>cast</b>, assegnando i ruoli agli studenti della classe.</li>
              <li>Puoi modificare il pronostico quante volte vuoi, <b>finché non viene pubblicato il risultato</b>.</li>
              <li>Il tuo pronostico resta <b>nascosto agli altri</b> fino al risultato. Dopo, tutti vedono le scelte di tutti.</li></ul>`)}
            ${section(4, 'Il punteggio', `<ul>
              <li><b>Musical indovinato</b>: 6 punti se era la tua prima scelta, 4 se era la seconda, 2 se era la terza. Se il musical non è tra le tue scelte, prendi 0 punti per quella classe.</li>
              <li><b>Cast</b>: conta solo il cast del musical indovinato. Vale fino a <b>12 punti</b>, in proporzione ai ruoli indovinati: 12 × ruoli giusti ÷ ruoli assegnati nel cast ufficiale. I ruoli non assegnati nel risultato ufficiale non contano.</li>
              <li>Massimo <b>18 punti</b> per classe. I punti sono arrotondati a un decimale.</li></ul>
              <div class="score-legend" style="margin:10px 0 4px"><strong>Esempio:</strong> il risultato è <i>Wicked</i> con 4 ruoli assegnati. Avevi messo <i>Wicked</i> come seconda scelta (<b>4 punti</b>) e hai indovinato 3 ruoli su 4 (12 × 3 ÷ 4 = <b>9 punti</b>): totale <b>13 punti</b>.</div>`)}
            ${section(5, 'Il risultato ufficiale', p('Qualsiasi membro della classe può inserire il musical assegnato e il cast ufficiale. Quando il risultato viene pubblicato, <b>i pronostici si chiudono</b> e compare la classifica.') + p('Se c’è un errore, il risultato si può correggere oppure annullare con <i>Riapri pronostici</i>: in quel caso i pronostici tornano modificabili e visibili solo ai loro autori.'))}
            ${section(6, 'La classifica', p('Ogni classe ha la sua classifica, ordinata per punti. A parità di punti i giocatori sono <b>a pari merito</b> e occupano la stessa posizione.'))}
            ${section(7, 'Il catalogo', p('Il catalogo dei musical è comune a tutte le classi. Se manca un titolo o un personaggio, chiunque può aggiungerlo dalla pagina Catalogo. Solo i musical con ruoli nel catalogo permettono di comporre il cast.'))}
            ${section(8, 'Fair play', `<ul>
              <li>Pubblica il risultato solo quando il musical e il cast sono <b>ufficiali</b>.</li>
              <li>Non riaprire i pronostici per cambiare le tue scelte dopo aver visto quelle degli altri.</li>
              <li>Invita solo persone che conosci: chi ha il link entra senza approvazione. Se il link finisce nelle mani sbagliate, generane uno nuovo dalla scheda Membri.</li></ul>`)}
          </div></section>`;
      }

      function renderCatalog() {
        current = null;
        document.getElementById('crumb').innerHTML = 'Fantamusical · <strong>Catalogo</strong>';
        const cards = catalog.map(item => `<article class="catalog-card" data-search="${esc(normalizeSearch([item.title, ...item.roles].join(' ')))}"><div class="panel-head"><div><h3>${esc(item.title)}</h3><span class="subtle">${plural(item.roles.length, 'ruolo', 'ruoli')}</span></div></div>
          <div class="role-list">${item.roles.map(role => `<span class="role-chip">${esc(role)}</span>`).join('') || '<span class="subtle">Nessun ruolo</span>'}</div>
          <form class="inline-form" data-add-role="${esc(item.key)}"><input name="role" maxlength="80" aria-label="Nuovo personaggio" placeholder="Aggiungi personaggio" required><button class="button secondary small" type="submit">Aggiungi ruolo</button></form></article>`).join('');
        view.innerHTML = `${heading('Catalogo condiviso', 'Musical e personaggi', 'Il catalogo è comune a tutte le classi. Aggiungi i titoli e i ruoli che mancano.')}
          <section class="panel" style="margin-bottom:16px"><div class="panel-head"><h2>Nuovo musical</h2></div><form id="musical-form" class="form-grid"><div class="field"><label for="new-title">Titolo</label><input id="new-title" name="title" maxlength="120" placeholder="Nome del musical" required></div><div class="field"><label for="new-roles">Personaggi</label><input id="new-roles" name="roles" placeholder="Es. Maria, Tony, Anita (facoltativo)"></div><div><button class="button" type="submit"><span class="plus">+</span> Aggiungi al catalogo</button></div></form></section>
          <div class="field" style="margin-bottom:12px"><label for="catalog-search">Cerca nel catalogo · ${catalog.length} musical</label><input id="catalog-search" type="search" placeholder="Titolo o personaggio" value="${esc(catalogQuery)}"></div>
          <div class="catalog-grid">${cards}</div><div id="catalog-none" class="panel empty" hidden><strong>Nessun risultato</strong>Puoi aggiungere il musical mancante qui sopra.</div>`;
        filterCatalog();
      }

      // Typo-tolerant search: each query word must appear in the text, or be within one edit of a word (or word prefix) there.
      function withinOneEdit(a, b) {
        if (Math.abs(a.length - b.length) > 1) return false;
        let i = 0, j = 0, edits = 0;
        while (i < a.length && j < b.length) {
          if (a[i] === b[j]) { i++; j++; continue; }
          if (++edits > 1) return false;
          if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
        }
        return edits + (a.length - i) + (b.length - j) <= 1;
      }
      function matchesQuery(text, query) {
        const words = text.split(/[^a-z0-9]+/).filter(Boolean);
        return query.split(/\s+/).filter(Boolean).every(token => text.includes(token)
          || (token.length >= 4 && words.some(word => withinOneEdit(token, word) || withinOneEdit(token, word.slice(0, token.length)))));
      }
      function filterCatalog() {
        const query = normalizeSearch(catalogQuery.trim());
        let visible = 0;
        view.querySelectorAll('.catalog-card').forEach(card => { card.hidden = Boolean(query) && !matchesQuery(card.dataset.search, query); if (!card.hidden) visible++; });
        const none = document.getElementById('catalog-none');
        if (none) none.hidden = visible > 0;
      }

      /* ---------- Events ---------- */
      document.addEventListener('click', event => {
        const go = event.target.closest('[data-go]');
        if (go) { location.hash = go.dataset.go; return; }
        const tab = event.target.closest('[data-tab]');
        if (tab && current) { history.replaceState(null, '', `#/classe/${current.id}/${tab.dataset.tab}`); currentTab = tab.dataset.tab; renderClass(); return; }
        const button = event.target.closest('[data-action]');
        if (!button) return;
        event.preventDefault();
        const action = button.dataset.action;
        if (action === 'logout') return signOut(false);
        if (action === 'retry') return boot();
        if (action === 'copy-link') {
          const input = document.getElementById('invite-link');
          navigator.clipboard?.writeText(input.value).then(() => toast('Link copiato.'), () => { input.select(); toast('Seleziona e copia il link.'); });
          return;
        }
        const reloadClass = async () => { await loadClass(current.id); renderClass(); };
        const handlers = {
          'reload': reloadClass,
          'request': async () => {
            const res = await api('requestAccess', { classId: button.dataset.id });
            await refreshMe();
            if (res.member) { location.hash = `#/classe/${res.id}`; return; }
            renderHome(); toast(`Richiesta inviata a ${res.name}.`);
          },
          'cancel-request': async () => { await api('cancelRequest', { classId: button.dataset.id }); await refreshMe(); renderHome(); toast('Richiesta annullata.'); },
          'remove-student': async () => { current.students = await api('removeStudent', { classId: current.id, studentId: button.dataset.id }); renderClass(); },
          'approve': async () => { await api('answerRequest', { classId: current.id, sub: button.dataset.sub, approve: true }); await reloadClass(); toast('Richiesta approvata.'); },
          'reject': async () => { await api('answerRequest', { classId: current.id, sub: button.dataset.sub, approve: false }); await reloadClass(); toast('Richiesta rifiutata.'); },
          'new-link': async () => {
            if (!confirm('Il link attuale smetterà di funzionare. Continuare?')) return;
            current.inviteCode = (await api('newInviteLink', { classId: current.id })).inviteCode; renderClass(); toast('Nuovo link generato.');
          },
          'leave': async () => {
            if (!confirm(`Vuoi davvero uscire da ${current.name}? Il tuo pronostico verrà eliminato.`)) return;
            await api('leaveClass', { classId: current.id }); current = null; await refreshMe(); location.hash = '#/'; toast('Sei uscito dalla classe.');
          },
          'save-result': async () => {
            if (!resultDraft.musicalKey) { toast('Seleziona il musical assegnato.'); return; }
            if (!current.result && !confirm('Pubblicando il risultato i pronostici si chiudono e diventano visibili a tutti. Continuare?')) return;
            await api('saveResult', { classId: current.id, result: resultDraft }); await reloadClass(); toast('Risultato pubblicato. Classifica aggiornata.');
          },
          'reopen': async () => {
            if (!confirm('Il risultato verrà cancellato e i pronostici torneranno modificabili. Continuare?')) return;
            await api('saveResult', { classId: current.id, result: null }); await reloadClass(); toast('Pronostici riaperti.');
          }
        };
        if (handlers[action]) withBusy(button, handlers[action]);
      });

      view.addEventListener('input', event => {
        if (event.target.id === 'catalog-search') { catalogQuery = event.target.value; filterCatalog(); }
        if (event.target.id === 'class-search') {
          const query = normalizeSearch(event.target.value.trim());
          let visible = 0;
          view.querySelectorAll('[data-class-name]').forEach(row => { row.hidden = Boolean(query) && !matchesQuery(row.dataset.className, query); if (!row.hidden) visible++; });
          document.getElementById('class-none').hidden = visible > 0;
        }
      });

      view.addEventListener('change', event => {
        const target = event.target;
        if (target.dataset.musicalRank !== undefined) {
          const rank = Number(target.dataset.musicalRank);
          const roles = catalogByKey.get(target.value)?.roles || [];
          const oldCast = draft[rank].cast || {};
          draft[rank] = { musicalKey: target.value, cast: Object.fromEntries(roles.filter(role => oldCast[role]).map(role => [role, oldCast[role]])) };
          renderClass(); return;
        }
        if (target.dataset.rank !== undefined) { draft[Number(target.dataset.rank)].cast[target.dataset.role] = target.value; return; }
        if (target.id === 'result-musical') { resultDraft = { musicalKey: target.value, cast: {} }; renderClass(); return; }
        if (target.dataset.resultRole !== undefined) resultDraft.cast[target.dataset.resultRole] = target.value;
      });

      view.addEventListener('submit', event => {
        event.preventDefault();
        const form = event.target;
        const button = form.querySelector('button[type="submit"]');
        const data = new FormData(form);
        if (form.id === 'create-class-form') return withBusy(button, async () => {
          const room = await api('createClass', { name: data.get('name') });
          await refreshMe(); location.hash = `#/classe/${room.id}/membri`; toast('Classe creata! Invita gli amici con il link.');
        });
        if (form.id === 'ballot-form') return withBusy(button, async () => {
          const choices = draft.filter(choice => choice.musicalKey);
          if (!choices.length) { toast('Scegli almeno un musical.'); return; }
          if (new Set(choices.map(c => c.musicalKey)).size !== choices.length) { toast('Scegli musical diversi.'); return; }
          current.myBallot = await api('saveBallot', { classId: current.id, choices });
          current.members.forEach(m => { if (m.sub === me.user.sub) m.hasBallot = true; });
          renderClass(); toast('Pronostico salvato.');
        });
        if (form.id === 'student-form') return withBusy(button, async () => {
          current.students = await api('addStudent', { classId: current.id, name: data.get('name') });
          renderClass(); view.querySelector('#student-form input')?.focus();
        });
        if (form.id === 'musical-form') return withBusy(button, async () => {
          const title = String(data.get('title')).trim();
          const roles = String(data.get('roles') || '').split(',').map(r => r.trim()).filter(Boolean);
          if (catalogByKey.has(musicalKey(title)) && !roles.length) { toast('Questo musical è già nel catalogo.'); return; }
          applyCatalogEntry(await api('catalogUpsert', { title, roles }));
          catalogQuery = title; renderCatalog(); toast('Catalogo aggiornato.');
        });
        if (form.dataset.addRole) return withBusy(button, async () => {
          const musical = catalogByKey.get(form.dataset.addRole);
          const role = String(data.get('role')).trim();
          if (!musical || musical.roles.some(r => musicalKey(r) === musicalKey(role))) { toast('Ruolo già presente.'); return; }
          applyCatalogEntry(await api('catalogUpsert', { title: musical.title, roles: [role] }));
          renderCatalog(); toast('Ruolo aggiunto.');
        });
      });

      /* ---------- Start ---------- */
      const saved = storage.get(TOKEN_KEY);
      if (configured && saved?.token && saved.exp * 1000 > Date.now() + 60000) { session = saved; boot(); }
      else route();
    })();
  </script>
  <script src="https://accounts.google.com/gsi/client" async></script>
</body>
